name: License checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headers-and-inventory:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_headers.py
      - run: python scripts/check_third_party.py
      - run: python scripts/check_legal_docs.py
