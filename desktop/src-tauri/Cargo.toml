[package]
name = "gramix-desktop"
version = "0.5.3"
description = "Gramix TON vanity generator desktop application"
authors = ["Gramix"]
edition = "2021"

[lib]
name = "gramix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.151"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.13.0"
tauri-plugin-notification = "2.8.1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
getrandom = "0.4.3"
